[package]
name = "agent-labor-market"
version = "0.1.0"
description = "Agent Labor Marketplace - On-chain marketplace for autonomous AI agent task execution"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "agent_labor_market"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token"] }
